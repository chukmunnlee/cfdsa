---
apiVersion: v1
kind: Namespace
metadata:
  name: rollout

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: rollout
spec:
  type: ClusterIP
  selector:
    app: api
    env: workshop03
  ports:
  - port: 3000
    targetPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: api-preview
  namespace: rollout
spec:
  type: ClusterIP
  selector:
    app: api
    env: workshop03
  ports:
  - port: 3000
    targetPort: 3000

---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: blue-green
  namespace: rollout
spec:
  replicas: 3
  selector:
    matchLabels:
      &pod-labels
      app: api
      env: workshop03
  strategy:
    blueGreen:
      activeService: api
      previewService: api-preview
      autoPromotionEnabled: false
  template:
    metadata:
      labels:
        <<: *pod-labels
    spec:
      containers:
      - name: api-container
        image: chukmunnlee/fake-api:v1-aug2026
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
