---
apiVersion: v1
kind: Namespace
metadata:
  name: rollout

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: rollout
spec:
  type: ClusterIP
  selector:
    app: api
    env: workshop03
  ports:
  - port: 3000
    targetPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: api-canary
  namespace: rollout
spec:
  type: ClusterIP
  selector:
    app: api
    env: workshop03
  ports:
  - port: 3000
    targetPort: 3000

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-httproute
  namespace: rollout
spec:
  hostnames:
  - api.192.168.50.201.nip.io
  parentRefs:
  - sectionName: http
    name: aalwg-gtw
    namespace: aalwg
    port: 80
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: api
      namespace: rollout
      port: 3000
      weight: 100
    - name: api-canary
      namespace: rollout
      port: 3000
      weight: 0

---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-ro
  namespace: rollout
spec:
  replicas: 3
  selector:
    matchLabels:
      &pod-labels
      app: api
      env: workshop03
  strategy:
    canary:
      stableService: api
      canaryService: api-canary
      steps:
      - setCanaryScale:
          weight: 33
      - setWeight: 25
      - pause: {}
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: api-httproute
            namespace: rollout
  template:
    metadata:
      labels:
        <<: *pod-labels
    spec:
      containers:
      - name: api-container
        image: chukmunnlee/fake-api:v1-aug2026
        ports:
        - containerPort: 3000
