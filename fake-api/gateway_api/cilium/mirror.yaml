---
apiVersion: v1
kind: Service
metadata:
  name: api-v1
  namespace: aalwg
spec:
  type: ClusterIP
  selector:
    app: api
    name: api
    version: v1
  ports:
  - port: 3000
    targetPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: api-v2
  namespace: aalwg
spec:
  type: ClusterIP
  selector:
    app: api
    name: api
    version: v2
  ports:
  - port: 3000
    targetPort: 3000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v1
  namespace: aalwg
spec:
  replicas: 2
  selector:
    matchLabels:
      &pod-labels
      app: api
      name: api
      version: v1
  template:
    metadata:
      labels:
        <<: *pod-labels
    spec:
      containers:
      - name: api-container
        image: chukmunnlee/fake-api:v1-aug2026
        imagePullPolicy: IfNotPresent
        env:
        - name: UID
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 3000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v2
  namespace: aalwg
spec:
  replicas: 2
  selector:
    matchLabels:
      &pod-labels
      app: api
      name: api
      version: v2
  template:
    metadata:
      labels:
        <<: *pod-labels
    spec:
      containers:
      - name: api-container
        image: chukmunnlee/fake-api:v2-aug2026
        imagePullPolicy: IfNotPresent
        env:
        - name: UID
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 3000

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-httproute
  namespace: aalwg
spec:
  hostnames:
  - api.192.168.50.201.nip.io
  parentRefs:
  - name: aalwg-gtw
    namespace: aalwg
    sectionName: http
    port: 80
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: api-v1
      namespace: aalwg
      port: 3000
    filters:
    - type: RequestMirror
      requestMirror:
        backendRef:
          name: api-v2
          namespace: aalwg
          port: 3000
        percent: 100
