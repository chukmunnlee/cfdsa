kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mycluster
networking:
  # Disable kube-proxy so Cilium can run in kube-proxy replacement mode
  disableDefaultCNI: true
  kubeProxyMode: "none"
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
nodes:
- role: control-plane
- role: worker
