---
apiVersion: v1
kind: Namespace
metadata:
  name: podinfo

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: podinfo
  name: podinfo
  namespace: podinfo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
      - image: stefanprodan/podinfo
        name: podinfo
        ports:
        - containerPort: 9898

---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: podinfo
  name: podinfo
  namespace: podinfo
spec:
  ports:
  - port: 9898
    protocol: TCP
    targetPort: 9898
  selector:
    app: podinfo
  type: ClusterIP
status:
  loadBalancer: {}

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: podinfo-gtw
  namespace: podinfo
spec:
  gatewayClassName: cilium
  listeners:
  - name: http
    hostname: '*.podinfo.192.168.39.201.nip.io'
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces: 
        from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
  namespace: podinfo
spec:
  hostnames:
  - info.podinfo.192.168.39.201.nip.io
  parentRefs:
  - name: podinfo-gtw
    namespace: podinfo
    port: 80
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: podinfo
      namespace: podinfo
      port: 9898

